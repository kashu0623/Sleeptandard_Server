services:
  postgres:
    image: postgres:16-alpine
    container_name: wearable-sleep-postgres
    environment:
      POSTGRES_USER: wearable
      POSTGRES_PASSWORD: wearable
      POSTGRES_DB: wearable_sleep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearable -d wearable_sleep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
